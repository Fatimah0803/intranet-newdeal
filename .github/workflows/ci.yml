name: CI Pipeline – Branche dev

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  # ─────────────────────────────────────────
  # JOB 1 : Build de l'image Docker
  # ─────────────────────────────────────────
  build:
    name: 🔨 Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build de l'image Docker
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/intranet-newdeal:dev .

      - name: Sauvegarder l'image pour les jobs suivants
        run: |
          docker save ${{ secrets.DOCKER_USERNAME }}/intranet-newdeal:dev \
            -o intranet-image.tar

      - name: Upload de l'image (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: intranet-image.tar
          # ── Notification email succès ──
      - name: 📧 Notification email (succès)
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ Pipeline réussi – Intranet NewDeal (${{ github.ref_name }})"
          body: |
            Le pipeline CI/CD s'est exécuté avec succès.
            Branche : ${{ github.ref_name }}
            Commit  : ${{ github.sha }}
          to: moussawade@groupeisi.com
          from: ${{ secrets.MAIL_USERNAME }}

      # ── Notification email échec ──
      - name: 📧 Notification email (échec)
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ Pipeline ÉCHOUÉ – Intranet NewDeal (${{ github.ref_name }})"
          body: |
            ⚠️ Le pipeline a échoué. Vérifiez les logs GitHub Actions.
            Branche : ${{ github.ref_name }}
            Commit  : ${{ github.sha }}
          to: moussawade@groupeisi.com
          from: ${{ secrets.MAIL_USERNAME }}

  # ─────────────────────────────────────────
  # JOB 2 : Scan de sécurité (Trivy)
  # ─────────────────────────────────────────
  security-scan:
    name: 🔒 Scan Sécurité
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout du code
        uses: actions/checkout@v3

      - name: Télécharger l'image Docker
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Charger l'image Docker
        run: docker load -i intranet-image.tar

      - name: Scan vulnérabilités avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/intranet-newdeal:dev
          format: table
          exit-code: 0          # 0 = ne bloque pas sur la branche dev
          severity: HIGH,CRITICAL

      - name: Scan secrets avec Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── Notification email succès ──
      - name: 📧 Notification email (succès)
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ Pipeline réussi – Intranet NewDeal (${{ github.ref_name }})"
          body: |
            Le pipeline CI/CD s'est exécuté avec succès.
            Branche : ${{ github.ref_name }}
            Commit  : ${{ github.sha }}
          to: moussawade@groupeisi.com
          from: ${{ secrets.MAIL_USERNAME }}

      # ── Notification email échec ──
      - name: 📧 Notification email (échec)
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ Pipeline ÉCHOUÉ – Intranet NewDeal (${{ github.ref_name }})"
          body: |
            ⚠️ Le pipeline a échoué. Vérifiez les logs GitHub Actions.
            Branche : ${{ github.ref_name }}
            Commit  : ${{ github.sha }}
          to: moussawade@groupeisi.com
          from: ${{ secrets.MAIL_USERNAME }}

  # ─────────────────────────────────────────
  # JOB 3 : Push vers Docker Hub
  # ─────────────────────────────────────────
  push:
    name: 📦 Push vers Docker Hub
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Télécharger l'image Docker
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Charger l'image Docker
        run: docker load -i intranet-image.tar

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push vers Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/intranet-newdeal:dev
          # ── Notification email succès ──
      - name: 📧 Notification email (succès)
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ Pipeline réussi – Intranet NewDeal (${{ github.ref_name }})"
          body: |
            Le pipeline CI/CD s'est exécuté avec succès.
            Branche : ${{ github.ref_name }}
            Commit  : ${{ github.sha }}
          to: moussawade@groupeisi.com
          from: ${{ secrets.MAIL_USERNAME }}

      # ── Notification email échec ──
      - name: 📧 Notification email (échec)
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ Pipeline   ÉCHOUÉ – Intranet NewDeal (${{ github.ref_name }})"
          body: |
            ⚠️ Le pipeline a échoué. Vérifiez  les logs GitHub Actions.
            Branche : ${{ github.ref_name }}
            Commit  : ${{ github.sha }}
          to: moussawade@groupeisi.com   
          from: ${{ secrets.MAIL_USERNAME }}