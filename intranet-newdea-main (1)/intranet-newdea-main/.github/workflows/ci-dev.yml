name: CI Pipeline - Dev

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  # ─────────────────────────────────────────
  # JOB 1 : Build de l'image Docker
  # ─────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build de l'image Docker
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-${{ github.sha }} .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-${{ github.sha }} \
                     ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-latest

      - name: Sauvegarde de l'image en tar pour les jobs suivants
        run: |
          docker save ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-latest \
            -o intranet-newdeal.tar

      - name: Upload de l'image comme artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: intranet-newdeal.tar

  # ─────────────────────────────────────────
  # JOB 2 : Scan de sécurité
  # ─────────────────────────────────────────
  security-scan:
    name: Security Scan (Vulnerabilities + Secrets)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Téléchargement de l'image Docker
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Chargement de l'image Docker
        run: docker load -i intranet-newdeal.tar

      # Scan des vulnérabilités avec Trivy
      - name: Scan des vulnérabilités avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-latest
          format: table
          exit-code: 0          # Ne bloque pas encore (voir évolution)
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          output: trivy-report.txt

      - name: Affichage du rapport Trivy
        run: cat trivy-report.txt

      # Scan des secrets avec Gitleaks
      - name: Scan des secrets avec Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # optionnel

      - name: Upload du rapport de vulnérabilités
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.txt

  # ─────────────────────────────────────────
  # JOB 3 : Push vers Docker Hub
  # ─────────────────────────────────────────
  push:
    name: Push Image to Docker Hub
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Téléchargement de l'image Docker
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Chargement de l'image Docker
        run: docker load -i intranet-newdeal.tar

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push de l'image vers Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-latest

      - name: Résumé du déploiement
        run: |
          echo "✅ Image poussée avec succès :"
          echo "  → ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-latest"
          echo "  → ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-${{ github.sha }}"
