name: CD Pipeline - Prod

on:
  push:
    branches:
      - prod

jobs:
  # ─────────────────────────────────────────
  # JOB 1 : Scan de sécurité pré-déploiement
  # ─────────────────────────────────────────
  security-scan:
    name: Security Scan avant déploiement
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull de l'image depuis Docker Hub
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-latest

      - name: Scan des vulnérabilités avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-latest
          format: table
          exit-code: 0
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          output: trivy-prod-report.txt

      - name: Affichage du rapport
        run: cat trivy-prod-report.txt

      - name: Upload du rapport
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-prod-report
          path: trivy-prod-report.txt

  # ─────────────────────────────────────────
  # JOB 2 : Déploiement sur runner_prod
  # ─────────────────────────────────────────
  deploy:
    name: Déploiement en Production
    runs-on: runner_prod          # Runner auto-hébergé dédié à la prod
    needs: security-scan

    steps:
      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Arrêt du conteneur existant (si présent)
        run: |
          docker stop intranet-newdeal || true
          docker rm intranet-newdeal || true

      - name: Pull de la dernière image
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-latest

      - name: Tag de l'image pour la prod
        run: |
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-latest \
                     ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:prod-latest

      - name: Démarrage du conteneur sur le port 80
        run: |
          docker run -d \
            --name intranet-newdeal \
            --restart always \
            -p 80:80 \
            ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:prod-latest

      - name: Vérification que le service est actif
        run: |
          sleep 5
          docker ps | grep intranet-newdeal
          curl -f http://localhost:80 && echo "✅ Site accessible sur le port 80"

      - name: Résumé du déploiement
        run: |
          echo "🚀 Déploiement en production réussi !"
          echo "  → Image : ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:prod-latest"
          echo "  → Port  : 80"
